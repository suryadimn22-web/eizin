<style>
:root{--g:#0b6b3a;--g2:#0e8a4b;--gl:#e8f4ec;--ink:#17201b;--mut:#5b6a62;--line:#dde5e0;--bg:#f3f6f4;

body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink)}

.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;min-width:0;flex:1 1 auto}

.pill .w{display:inline}
@media (max-width:430px){.pill .w{display:none}}
.brand b{font-size:17px;letter-spacing:.2px}

.logo{width:32px;height:32px;border-radius:9px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.sp{flex:1}
.pill{font-size:12px;line-height:1;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;border:0;font-weight:600;white-space:nowrap;cursor:pointer}
.pill.off{background:#fbd38d;color:#5a3500}
.pill.demo{background:#fff;color:var(--g)}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:21px;margin:4px 0 6px}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 6px}
p{margin:6px 0}
.mut{color:var(--mut);font-weight:400}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.note{background:var(--ambl);border-color:#f3d9a4}
.card.ok{background:var(--gl);border-color:#bfe0cb}
label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c9d4ce;border-radius:10px;font:inherit;background:#fff;color:inherit;min-height:44px}

input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:0;border-color:var(--g2)}

.row2>div>label{margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:10px 12px;border:1px solid #c9d4ce;background:#fff;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;color:inherit;min-height:44px}
.seg button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;min-height:44px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}

.btn.sm{padding:7px 12px;min-height:36px;font-size:13.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.big{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;font-size:16px}
.big .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;flex:none}
.btn.ghost.big .ic{background:var(--gl)}
.big small{display:block;font-weight:400;font-size:13px;opacity:.85}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--gl);color:#0a4f2b;border-radius:99px;padding:4px 4px 4px 11px;font-size:13.5px;margin:6px 6px 0 0}
.chip button{border:0;background:transparent;color:inherit;font-size:17px;line-height:1;width:26px;height:26px;border-radius:99px;cursor:pointer}
.chip.ro{padding-right:11px}

.sugg{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.sugg:empty{display:none}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 12px;font:inherit;cursor:pointer;color:inherit}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus{background:var(--gl)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef1ef;color:var(--mut)}
.st-Menunggu{background:var(--ambl);color:var(--amb)}
.st-Disetujui{background:var(--gl);color:var(--g)}
.st-Ditolak{background:var(--redl);color:var(--red)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

.kv dd{margin:0;word-break:break-word}

.empty{text-align:center;color:var(--mut);padding:30px 10px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}

.nav a.on{color:var(--g);font-weight:700}

.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:14px;border-radius:0 4px 4px 0}

.v-bad{background:var(--redl);border-color:var(--red);color:var(--red)}

.toolbar .btn{flex:1 1 120px}

.nomor{text-align:center;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 10px;font-size:14px}

.ttd img{height:70px;max-width:220px;display:block;margin:2px 0}
.ttd .blank{height:70px}
.ket{margin-top:14px;padding-top:6px;border-top:1px solid #ccc;font-size:10.5px;color:#444;font-family:system-ui,sans-serif}
@media (max-width:480px){

 .qr{width:96px}.qr svg{width:90px;height:90px}
 .ttd{min-width:0}
 .kv{grid-template-columns:96px 1fr}
}
@media print{
 @page{size:A4;margin:16mm 18mm}
 .no-print,.top,.nav,#toast{display:none!important}
 body{background:#fff}
 main{padding:0;max-width:none}
 .paper{border:0;box-shadow:none;padding:0;font-size:12pt}
}

<header class="top no-print"><div class="top-in" id="hdr"></div></header>
<main id="app"></main>
<nav class="nav no-print" id="nav" hidden></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :

<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycby3USSiWgvvo4aS6pMbx-Sm_i_YNXMJlaY_37x8_nHShn5Xtqcgqqp2SME_YDLq9oQ/exec';
/* ===================================================================== */

const APP_VERSI = '1.0';
const SERVER = (localStorage.getItem('eizin_api') || API_URL).trim();
const DEMO = !SERVER;
const JENIS_PEMOHON = ['Siswa', 'Pembina', 'Koordinator Kelas Program'];
const JENIS_IZIN = ['Keluar Sekolah Sementara', 'Pulang Lebih Awal', 'Mengikuti Lomba/Kegiatan', 'Lainnya'];
const IKON_IZIN = { 'Keluar Sekolah Sementara': '🚶', 'Pulang Lebih Awal': '🏠', 'Mengikuti Lomba/Kegiatan': '🏆', 'Lainnya': '📄' };
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const DEFAULT_CFG = {

  kop2: 'KANTOR KEMENTERIAN AGAMA KOTA PEKANBARU', kop3: 'MADRASAH ALIYAH NEGERI 2 KOTA PEKANBARU',
  alamat: '', penandatangan: 'Suryadi, S.E., M.M.', nip: '', jabatan: 'Wakil Kepala Madrasah Bidang Kurikulum',

// ---------------------------------------------------------------- penyimpanan lokal
const store = {
  get(k, d) { try { const v = localStorage.getItem('eizin_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('eizin_' + k, JSON.stringify(v)); } catch (e) { toast('Memori penyimpanan HP penuh. Hapus data demo atau lampiran besar.'); } },
  del(k) { try { localStorage.removeItem('eizin_' + k); } catch (e) { } }
};
let cfg = Object.assign({}, DEFAULT_CFG, store.get('cfg', {}));
let siswaList = store.get('siswa', []);
let admin = store.get('admin', null);           // {pin}
let records = store.get('records', []);         // cache izin (admin)
let ops = store.get('ops', []);                 // antrean perubahan admin yang belum terkirim
let online = navigator.onLine;
let syncing = false;
let installPrompt = null;

// ---------------------------------------------------------------- utilitas
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const h = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rand(n) { const a = new Uint32Array(n); (window.crypto || window.msCrypto).getRandomValues(a); return Array.from(a, x => ALPHA[x % ALPHA.length]).join(''); }
function localISO(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const today = () => localISO().slice(0, 10);
function newId() { const d = new Date(); return `IZN-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${rand(4)}`; }
function parseD(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function fmtTgl(s, hari = true) { if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return '-'; const d = parseD(s); return (hari ? HARI[d.getDay()] + ', ' : '') + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtWaktu(iso) { if (!iso) return '-'; const t = String(iso).slice(11, 16); return fmtTgl(iso, false) + (t ? ', ' + t.replace(':', '.') : ''); }
function fmtJam(j) { return j ? j.replace(':', '.') + ' WIB' : ''; }
function rentang(r) { return fmtTgl(r.tglMulai) + (r.tglSelesai && r.tglSelesai !== r.tglMulai ? ' s.d. ' + fmtTgl(r.tglSelesai) : ''); }
function waNum(n) { n = String(n || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); return n; }
function namaSiswa(r, max = 3) { const s = r.siswa || []; const t = s.slice(0, max).map(x => x.nama).join(', '); return s.length > max ? `${t} +${s.length - max} lainnya` : t; }
function baseUrl() { return location.origin + location.pathname; }
function verifyUrl(r) { return `${baseUrl()}?cek=${encodeURIComponent(r.id)}&k=${encodeURIComponent(r.kode)}`; }
function homeHref(hash) { return location.search ? baseUrl() + hash : hash; }
class NetErr extends Error { }

function toast(msg, ms = 2800) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

// ---------------------------------------------------------------- server (Apps Script / demo)
function applyOp(list, op) {
  if (op.type === 'upsert') {
    const i = list.findIndex(r => r.id === op.izin.id);
    if (i >= 0) list[i] = Object.assign({}, op.izin); else list.push(Object.assign({}, op.izin));
  } else if (op.type === 'putus') {
    const r = list.find(r => r.id === op.id);
    if (r) { r.status = op.status; r.catatan = op.catatan || ''; r.diputuskan = op.waktu; }
  } else if (op.type === 'kembali') {
    const r = list.find(r => r.id === op.id);
    if (r) r.kembaliAktual = op.waktu;
  } else if (op.type === 'ttd') {
    cfg.ttd = op.dataUrl;
  }
}

const Demo = {
  PIN: '123456',
  db() {
    let d = store.get('demo_db', null);
    if (!d) { d = seedDemo(); store.set('demo_db', d); }
    return d;
  },
  handle(action, p) {
    const d = this.db();
    const pub = () => Object.assign({}, DEFAULT_CFG, d.cfg, { perluKode: false });
    const save = () => store.set('demo_db', d);
    switch (action) {
      case 'config': return { ok: true, config: pub() };
      case 'siswa': return { ok: true, siswa: d.siswa };
      case 'cek': {
        const r = d.izin.find(x => x.id === p.id);
        if (!r) return { ok: false, error: 'Izin tidak ditemukan' };
        if (r.kode !== String(p.k || '').trim().toUpperCase()) return { ok: false, error: 'Kode verifikasi tidak cocok' };
        return { ok: true, izin: r, config: pub() };
      }
      case 'ajukan': {
        const i = p.izin;
        if (d.izin.some(x => x.id === i.id)) return { ok: true, id: i.id, kode: i.kode, duplikat: true };
        const r = Object.assign({}, i, { status: 'Menunggu', sumber: 'Online', diputuskan: '', catatan: '', lampiran: i.lampiranData || '' });
        delete r.lampiranData;
        d.izin.push(r); save();
        return { ok: true, id: r.id, kode: r.kode };
      }
      case 'login': return p.pin === this.PIN ? { ok: true, config: pub() } : { ok: false, error: 'PIN salah' };
      case 'list': case 'sync': {
        if (p.pin !== this.PIN) return { ok: false, error: 'PIN salah' };
        (p.ops || []).forEach(op => {
          if (op.type === 'ttd') d.cfg.ttd = op.dataUrl; else applyOp(d.izin, op);
        });
        save();
        return { ok: true, izin: d.izin, siswa: d.siswa, config: pub(), hasil: (p.ops || []).map((_, i) => ({ i, ok: true })) };
      }
    }
    return { ok: false, error: 'Aksi tidak dikenal' };
  }
};

function seedDemo() {
  const nama = [['2401', 'Ahmad Fauzan', 'X-1'], ['2402', 'Nabila Putri', 'X-1'], ['2403', 'Rizky Ramadhan', 'X-2'], ['2404', 'Aisyah Zahra', 'X-2'],
  ['2301', 'Muhammad Iqbal', 'XI-1'], ['2302', 'Salsabila Azzahra', 'XI-1'], ['2303', 'Dimas Saputra', 'XI-2'], ['2304', 'Khairunnisa', 'XI-2'],
  ['2305', 'Fikri Hidayat', 'XI-3'], ['2201', 'Alya Rahmadani', 'XII-1'], ['2202', 'Hafiz Maulana', 'XII-1'], ['2203', 'Tiara Anggraini', 'XII-2']];
  const siswa = nama.map(([nis, n, kelas]) => ({ nis, nama: n, kelas }));
  const t = today(); const y = localISO(new Date(Date.now() - 86400e3)).slice(0, 10);
  const mk = (o) => Object.assign({ id: newId(), kode: rand(6), dibuat: localISO(), sumber: 'Online', hpPemohon: '', tglSelesai: '', jamKeluar: '', jamKembali: '', namaKegiatan: '', tempat: '', penyelenggara: '', pembina: '', lampiran: '', diputuskan: '', catatan: '', kembaliAktual: '' }, o);
  return {

      mk({ jenisPemohon: 'Pembina', namaPemohon: 'Bpk. Pembina Debat (contoh)', jenisIzin: 'Mengikuti Lomba/Kegiatan', siswa: [siswa[5], siswa[7], siswa[9]], tglMulai: t, tglSelesai: t, keperluan: 'Mengikuti Lomba Debat Ekonomi tingkat Kota', namaKegiatan: 'Lomba Debat Ekonomi', tempat: 'Aula Kampus (contoh)', penyelenggara: 'Panitia (contoh)', pembina: 'Bpk. Pembina Debat (contoh)', status: 'Menunggu' }),
      mk({ jenisPemohon: 'Siswa', namaPemohon: 'Rizky Ramadhan', jenisIzin: 'Keluar Sekolah Sementara', siswa: [siswa[2]], tglMulai: y, jamKeluar: '10:00', jamKembali: '11:00', keperluan: 'Mengambil berkas di rumah (contoh)', status: 'Disetujui', diputuskan: y + 'T09:50:00', kembaliAktual: y + 'T10:55:00' }),
      mk({ jenisPemohon: 'Koordinator Kelas Program', namaPemohon: 'Ibu Koordinator (contoh)', jenisIzin: 'Pulang Lebih Awal', siswa: [siswa[4]], tglMulai: y, jamKeluar: '13:00', keperluan: 'Sakit, dijemput orang tua (contoh)', status: 'Disetujui', diputuskan: y + 'T12:40:00' })
    ]
  };
}

async function api(action, payload = {}) {
  if (DEMO) { await sleep(120); return JSON.parse(JSON.stringify(Demo.handle(action, payload))); }
  const isGet = ['config', 'siswa', 'cek'].includes(action);
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    let res;
    if (isGet) {
      const q = new URLSearchParams(Object.assign({ action }, payload));
      res = await fetch(SERVER + (SERVER.includes('?') ? '&' : '?') + q.toString(), { signal: ctl.signal });
    } else {
      // body teks biasa → tidak memicu preflight CORS (Apps Script tidak mendukung OPTIONS)
      res = await fetch(SERVER, { method: 'POST', body: JSON.stringify(Object.assign({ action }, payload)), signal: ctl.signal });
    }
    const j = await res.json();
    setOnline(true);
    return j;
  } catch (e) {
    setOnline(false);
    throw new NetErr('Tidak terhubung ke server');
  } finally { clearTimeout(timer); }
}

function setOnline(v) { if (online !== v) { online = v; renderHeader(); if (v) onReconnect(); } }

async function refreshConfig() {
  try {
    const r = await api('config');
    if (!r.ok) return;
    const before = cfg.perluKode;
    cfg = Object.assign({}, DEFAULT_CFG, r.config); pendingTtd(); store.set('cfg', cfg);
    // pengaturan "kode akses" berubah → tampilkan ulang form pengajuan (isian tetap tersimpan)
    const frm = $('#frm');
    if (before !== cfg.perluKode && curRoute() === 'ajukan' && frm && !frm.contains(document.activeElement)) viewAjukan();
  } catch (e) { }
}
function pendingTtd() { ops.filter(o => o.type === 'ttd').forEach(o => { cfg.ttd = o.dataUrl; }); }

async function loadSiswa(force) {
  if (!force && siswaList.length && Date.now() - store.get('siswa_t', 0) < 6 * 3600e3) return;
  try {
    const r = await api('siswa', cfg.perluKode ? { kodeAkses: store.get('kodeAkses', '') } : {});
    if (r.ok) { siswaList = r.siswa; store.set('siswa', siswaList); store.set('siswa_t', Date.now()); }
  } catch (e) { }
}

// ---------------------------------------------------------------- antrean pemohon (offline)
async function flushOutbox() {
  const ob = store.get('outbox', []);
  if (!ob.length) return;
  const left = [];
  let net = false;
  for (const it of ob) {
    if (net) { left.push(it); continue; }
    try {
      const r = await api('ajukan', { izin: it.izin, kodeAkses: it.kodeAkses });
      if (!r.ok) left.push(Object.assign(it, { error: r.error }));
    } catch (e) { net = true; left.push(it); }
  }
  store.set('outbox', left);
  if (left.length < ob.length) toast(`${ob.length - left.length} pengajuan tertunda berhasil terkirim`);
  renderHeader();
  if (curRoute() === 'status') route();
}

// ---------------------------------------------------------------- sinkron admin
async function syncAdmin(silent) {
  if (!admin || syncing) return;
  if (!DEMO && !navigator.onLine) { setOnline(false); if (!silent) toast('Sedang offline — perubahan tersimpan di HP dan akan dikirim otomatis'); return; }
  syncing = true; renderHeader();
  const sending = ops.slice();
  try {
    const r = await api(sending.length ? 'sync' : 'list', { pin: admin.pin, ops: sending });
    if (!r.ok) {
      if (/PIN/i.test(r.error || '')) { toast('PIN tidak cocok dengan server. Silakan masuk lagi.', 4000); logout(true); }
      else toast('Gagal sinkron: ' + h(r.error));
      return;
    }
    const gagal = (r.hasil || []).filter(x => !x.ok);
    if (gagal.length) toast(`${gagal.length} perubahan ditolak server: ${h(gagal[0].error)}`, 5000);
    ops = ops.slice(sending.length); store.set('ops', ops);
    records = r.izin || [];
    if (r.config) cfg = Object.assign({}, DEFAULT_CFG, r.config);
    ops.forEach(op => applyOp(records, op));
    store.set('records', records); store.set('cfg', cfg);
    if (r.siswa) { siswaList = r.siswa; store.set('siswa', siswaList); store.set('siswa_t', Date.now()); }
    store.set('lastsync', Date.now());
    if (!silent) toast('Data sudah tersinkron ✓');
  } catch (e) {
    if (!silent) toast('Tidak ada koneksi — perubahan tersimpan di HP dan akan dikirim otomatis');
  } finally {
    syncing = false; renderHeader(); refreshAdminView();
  }
}

function pushOp(op) {
  ops.push(op); store.set('ops', ops);
  applyOp(records, op); store.set('records', records);
  renderHeader();
  syncAdmin(true);
}

function onReconnect() { flushOutbox(); if (admin) syncAdmin(true); }

function logout(keepMsg) {
  admin = null; store.del('admin');
  if (!keepMsg) toast('Anda sudah keluar');
  location.hash = '#/admin';
  route();
}

async function sha(s) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('eizin|' + s));
    return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { let x = 5381; for (const c of 'eizin|' + s) x = ((x << 5) + x + c.charCodeAt(0)) | 0; return 'f' + x; }
}

// ---------------------------------------------------------------- header & navigasi
function pendingCount() { return ops.length + store.get('outbox', []).length; }
function renderHeader() {
  const n = pendingCount();
  let mode;
  if (DEMO) mode = '<button class="pill demo" id="pmode">Mode Demo</button>';
  else if (syncing) mode = '<button class="pill" id="pmode">Menyinkron…</button>';
  else if (online) mode = '<button class="pill" id="pmode">● Online</button>';
  else mode = '<button class="pill off" id="pmode">● Offline</button>';
  $('#hdr').innerHTML = `
    <a class="brand" href="${homeHref('#/')}"><span class="logo">e</span><span><b>e-Izin</b><small>${h(cfg.namaMadrasah || 'MAN 2 Kota Pekanbaru')}</small></span></a>
    ${n ? `<button class="pill off" id="ppend" title="Data belum terkirim ke server">⟳ ${n}<span class="w"> belum terkirim</span></button>` : ''}
    ${mode}`;
  const tap = () => { if (DEMO) toast('Mode demo: data hanya tersimpan di HP/browser ini. PIN admin demo: <b>123456</b>', 4500); else { flushOutbox(); if (admin) syncAdmin(); else refreshConfig().then(() => toast(online ? 'Terhubung ke server' : 'Belum terhubung ke server')); } };
  $('#pmode').onclick = tap; if ($('#ppend')) $('#ppend').onclick = tap;
  renderNav();
}

function curRoute() { return (location.hash || '#/').slice(2).split('/')[0]; }

function renderNav() {
  const nav = $('#nav');
  const parts = (location.hash || '#/').slice(2).split('/');
  if (!admin || location.search || !['admin', 'surat'].includes(parts[0])) { nav.hidden = true; return; }
  const tab = parts[0] === 'surat' ? 'riwayat' : (parts[1] || 'menunggu');
  const nPend = records.filter(r => r.status === 'Menunggu').length;
  const items = [['menunggu', '⏳', 'Menunggu'], ['input', '➕', 'Input Langsung'], ['riwayat', '🗂️', 'Riwayat'], ['rekap', '📊', 'Rekap'], ['setelan', '⚙️', 'Setelan']];
  nav.innerHTML = items.map(([k, ic, t]) => `<a href="#/admin/${k}" class="${tab === k ? 'on' : ''}"><span>${ic}</span>${t}${k === 'menunggu' && nPend ? `<i class="cnt">${nPend}</i>` : ''}</a>`).join('');
  nav.hidden = false;
}

function route() {
  window.scrollTo(0, 0);
  const qs = new URLSearchParams(location.search);
  renderHeader();
  if (qs.get('cek')) return viewCek(qs.get('cek'), qs.get('k') || '');
  const [a, b, c] = (location.hash || '#/').slice(2).split('/');
  if (!a) return viewHome();
  if (a === 'ajukan') return viewAjukan();
  if (a === 'status') return viewStatus();
  if (a === 'lihat') return viewLihat(decodeURIComponent(b || ''), decodeURIComponent(c || ''));
  if (a === 'admin' || a === 'surat') {
    if (!admin) return viewLogin();
    if (a === 'surat') return viewSuratAdmin(decodeURIComponent(b || ''));
    return viewAdmin(b || 'menunggu');
  }
  viewHome();
}

function refreshAdminView() {
  const [a, b] = (location.hash || '#/').slice(2).split('/');
  renderNav();
  if (a !== 'admin' || !admin) return;
  const tab = b || 'menunggu';
  const ae = document.activeElement;
  if (tab === 'input' || tab === 'setelan') return;
  if (ae && ['TEXTAREA', 'INPUT', 'SELECT'].includes(ae.tagName) && $('#app').contains(ae) && ae.value) return;
  viewAdmin(tab, true);
}

const app = () => $('#app');

// ---------------------------------------------------------------- halaman: beranda
function viewHome() {
  app().innerHTML = `
    ${DEMO ? `<div class="card note small"><b>Mode Demo.</b> Aplikasi belum terhubung ke Google Spreadsheet madrasah, jadi data hanya tersimpan di HP/browser ini. Silakan dicoba: ajukan izin, lalu masuk sebagai Waka dengan PIN <b>123456</b> untuk menyetujuinya.</div>` : ''}
    <h1>Izin Siswa</h1>
    <p class="mut">Ajukan izin keluar sekolah, pulang lebih awal, atau dispensasi lomba/kegiatan. Persetujuan dan surat izin dikirim secara elektronik.</p>
    <div style="display:grid;gap:10px;margin:16px 0">
      <a class="btn big" href="#/ajukan"><span class="ic">📝</span><span>Ajukan Izin<small>Untuk siswa, pembina, dan koordinator kelas program</small></span></a>
      <a class="btn ghost big" href="#/status"><span class="ic">🔎</span><span>Cek Status & Surat Izin<small>Lihat apakah pengajuan sudah disetujui</small></span></a>
    </div>
    <div class="card small">
      <h3>Alurnya</h3>

// ---------------------------------------------------------------- form pengajuan (dipakai pemohon & admin)
function blankForm(mode) {
  return {
    jenisPemohon: 'Siswa', namaPemohon: '', hpPemohon: '', jenisIzin: JENIS_IZIN[0], siswa: [],
    tglMulai: today(), tglSelesai: '', jamKeluar: '', jamKembali: '', keperluan: '',
    namaKegiatan: '', tempat: '', penyelenggara: '', pembina: '', lampiranData: ''
  };
}

function mountForm(el, f, mode, onSubmit) {
  const isAdmin = mode === 'admin';
  const render = () => {
    const ji = f.jenisIzin, lomba = ji === 'Mengikuti Lomba/Kegiatan';
    const namaLabel = f.jenisPemohon === 'Siswa' ? 'Nama siswa yang mengajukan' : (f.jenisPemohon === 'Pembina' ? 'Nama pembina' : 'Nama koordinator kelas program');
    const showKembali = ji === 'Keluar Sekolah Sementara' || ji === 'Lainnya';
    const opt = ji === 'Lainnya' ? ' <span class="mut">(opsional)</span>' : '';
    el.innerHTML = `
      <div class="card">
        <label>${isAdmin ? 'Yang mengajukan' : 'Saya mengajukan sebagai'}</label>
        <div class="seg" data-seg="jenisPemohon">${JENIS_PEMOHON.map(j => `<button type="button" class="${f.jenisPemohon === j ? 'on' : ''}" data-v="${h(j)}">${h(j)}</button>`).join('')}</div>
        <label for="f-nama">${namaLabel}</label>
        <input id="f-nama" data-k="namaPemohon" value="${h(f.namaPemohon)}" autocomplete="off" placeholder="${f.jenisPemohon === 'Siswa' ? 'Terisi otomatis dari siswa pertama' : ''}">
        ${isAdmin ? '' : `<label for="f-hp">Nomor HP/WhatsApp <span class="mut">(opsional, untuk menerima surat)</span></label>
        <input id="f-hp" data-k="hpPemohon" inputmode="tel" value="${h(f.hpPemohon)}" placeholder="08xxxxxxxxxx">`}
      </div>
      <div class="card">
        <label>Jenis izin</label>
        <div class="seg" data-seg="jenisIzin">${JENIS_IZIN.map(j => `<button type="button" class="${ji === j ? 'on' : ''}" data-v="${h(j)}">${IKON_IZIN[j]} ${h(j)}</button>`).join('')}</div>
        <label for="cari">Siswa yang izin <span class="mut">(bisa lebih dari satu)</span></label>
        <div id="chips">${f.siswa.map((s, i) => `<span class="chip">${h(s.nama)}${s.kelas ? ' · ' + h(s.kelas) : ''}<button type="button" data-rm="${i}" aria-label="Hapus ${h(s.nama)}">×</button></span>`).join('')}</div>
        <input id="cari" placeholder="Ketik nama, NIS, atau kelas…" autocomplete="off">
        <div id="sugg" class="sugg"></div>
        ${siswaList.length ? '' : '<p class="small mut" id="f-nosiswa">Daftar siswa belum termuat. Tulis manual dengan format: <b>Nama / Kelas</b>, lalu pilih "Tambah".</p>'}
        <div class="row2">
          <div><label for="f-t1">${lomba ? 'Tanggal mulai' : 'Tanggal'}</label><input type="date" id="f-t1" data-k="tglMulai" value="${h(f.tglMulai)}"></div>
          ${lomba ? `<div><label for="f-t2">Tanggal selesai</label><input type="date" id="f-t2" data-k="tglSelesai" value="${h(f.tglSelesai)}"></div>` : ''}
        </div>
        ${lomba ? '' : `<div class="row2">
          <div><label for="f-j1">Jam keluar${opt}</label><input type="time" id="f-j1" data-k="jamKeluar" value="${h(f.jamKeluar)}"></div>
          ${showKembali ? `<div><label for="f-j2">Jam kembali${opt}</label><input type="time" id="f-j2" data-k="jamKembali" value="${h(f.jamKembali)}"></div>` : ''}
        </div>`}
        ${lomba ? `
          <label for="f-keg">Nama lomba/kegiatan</label><input id="f-keg" data-k="namaKegiatan" value="${h(f.namaKegiatan)}" placeholder="Contoh: Olimpiade Ekonomi tingkat Provinsi">
          <div class="row2">
            <div><label for="f-tmp">Tempat</label><input id="f-tmp" data-k="tempat" value="${h(f.tempat)}"></div>
            <div><label for="f-pny">Penyelenggara</label><input id="f-pny" data-k="penyelenggara" value="${h(f.penyelenggara)}"></div>
          </div>
          <label for="f-pmb">Pembina/guru pendamping</label><input id="f-pmb" data-k="pembina" value="${h(f.pembina)}">
          ${isAdmin ? '' : `<label for="f-lamp">Foto surat undangan/tugas <span class="mut">(opsional)</span></label>
          <input type="file" id="f-lamp" accept="image/*">
          ${f.lampiranData ? `<img class="thumb" src="${f.lampiranData}" alt="Pratinjau lampiran"><button type="button" class="btn ghost sm" id="f-lamp-x" style="margin-top:6px">Hapus foto</button>` : ''}`}` : ''}
        <label for="f-kep">Keperluan / alasan</label>
        <textarea id="f-kep" data-k="keperluan" rows="3" placeholder="${lomba ? 'Contoh: Mewakili madrasah dalam lomba…' : 'Contoh: Mengambil berkas yang tertinggal di rumah'}">${h(f.keperluan)}</textarea>
        ${!isAdmin && cfg.perluKode ? `<label for="f-kode">Kode akses madrasah</label><input id="f-kode" value="${h(store.get('kodeAkses', ''))}" autocomplete="off">` : ''}
      </div>
      <p class="small" id="f-err" style="color:var(--red)"></p>
      <button class="btn block" id="f-submit" type="button">${isAdmin ? '✓ Setujui & buat surat' : 'Kirim pengajuan'}</button>`;
    bind();
  };

  const addSiswa = s => {
    if (f.siswa.some(x => (x.nis && x.nis === s.nis) || (!x.nis && x.nama.toLowerCase() === s.nama.toLowerCase() && x.kelas === s.kelas))) return;
    f.siswa.push(s);
    if (f.jenisPemohon === 'Siswa' && !f.namaPemohon) f.namaPemohon = s.nama;
  };

  const bind = () => {
    $$('[data-k]', el).forEach(inp => inp.addEventListener('input', () => { f[inp.dataset.k] = inp.value; }));
    $$('[data-seg] button', el).forEach(b => b.onclick = () => { f[b.parentNode.dataset.seg] = b.dataset.v; render(); });
    $$('[data-rm]', el).forEach(b => b.onclick = () => { f.siswa.splice(Number(b.dataset.rm), 1); render(); $('#cari', el).focus(); });
    const cari = $('#cari', el), sugg = $('#sugg', el);
    cari.oninput = () => {
      const q = cari.value.trim().toLowerCase();
      if (q.length < 2) { sugg.innerHTML = ''; return; }
      const terms = q.split(/\s+/);
      const m = siswaList.filter(s => { const t = `${s.nama} ${s.nis} ${s.kelas}`.toLowerCase(); return terms.every(w => t.includes(w)); })
        .filter(s => !f.siswa.some(x => x.nis && x.nis === s.nis)).slice(0, 8);
      const kelas = siswaList.filter(s => s.kelas.toLowerCase() === q);
      let html = m.map(s => `<button type="button" data-add="${h(s.nis)}"><b>${h(s.nama)}</b> <span class="mut small">· ${h(s.kelas)} · NIS ${h(s.nis)}</span></button>`).join('');
      if (kelas.length) html += `<button type="button" data-kelas="${h(kelas[0].kelas)}">➕ Tambah semua siswa kelas <b>${h(kelas[0].kelas)}</b> (${kelas.length} siswa)</button>`;
      if (!m.length && q.length >= 3) {
        const [nm, kl] = cari.value.split('/').map(x => x.trim());
        html += `<button type="button" data-manual="1">➕ Tambah manual: <b>${h(nm)}</b>${kl ? ' · ' + h(kl) : ' <span class="mut small">(tulis "Nama / Kelas" agar kelas tercatat)</span>'}</button>`;
      }
      sugg.innerHTML = html;
      $$('[data-add]', sugg).forEach(b => b.onclick = () => { addSiswa(siswaList.find(s => s.nis === b.dataset.add)); render(); $('#cari', el).focus(); });
      $$('[data-kelas]', sugg).forEach(b => b.onclick = () => { siswaList.filter(s => s.kelas === b.dataset.kelas).forEach(addSiswa); render(); });
      $$('[data-manual]', sugg).forEach(b => b.onclick = () => {
        const [nm, kl] = cari.value.split('/').map(x => x.trim());
        if (nm) addSiswa({ nis: '', nama: nm.replace(/\s+/g, ' '), kelas: (kl || '').toUpperCase() });
        render(); $('#cari', el).focus();
      });
    };
    const lamp = $('#f-lamp', el);
    if (lamp) lamp.onchange = async () => {
      const file = lamp.files && lamp.files[0]; if (!file) return;
      try { f.lampiranData = await compressImage(file, 1280, 0.72); render(); }
      catch (e) { toast('Foto tidak dapat dibaca. Coba foto lain.'); }
    };
    const lx = $('#f-lamp-x', el); if (lx) lx.onclick = () => { f.lampiranData = ''; render(); };
    const kd = $('#f-kode', el);
    if (kd) kd.onchange = () => { store.set('kodeAkses', kd.value.trim()); loadSiswa(true).then(() => { const n = $('#f-nosiswa', el); if (n && siswaList.length) n.remove(); }); };
    $('#f-submit', el).onclick = async () => {
      const kodeInp = $('#f-kode', el); if (kodeInp) store.set('kodeAkses', kodeInp.value.trim());
      const err = validate(f, mode);
      $('#f-err', el).textContent = err || '';
      if (err) { $('#f-err', el).scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
      const btn = $('#f-submit', el); btn.disabled = true; btn.textContent = 'Memproses…';
      try { await onSubmit(f); } finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = isAdmin ? '✓ Setujui & buat surat' : 'Kirim pengajuan'; } }
    };
  };
  render();
}

function validate(f, mode) {
  const ji = f.jenisIzin;
  if (!f.namaPemohon.trim()) return 'Nama pemohon wajib diisi.';
  if (!f.siswa.length) return 'Pilih minimal satu siswa yang izin.';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.tglMulai)) return 'Tanggal wajib diisi.';
  if (ji === 'Keluar Sekolah Sementara') {
    if (!f.jamKeluar || !f.jamKembali) return 'Jam keluar dan jam kembali wajib diisi.';
    if (f.jamKembali <= f.jamKeluar) return 'Jam kembali harus setelah jam keluar.';
  }
  if (ji === 'Pulang Lebih Awal' && !f.jamKeluar) return 'Jam keluar wajib diisi.';
  if (ji === 'Lainnya' && f.jamKeluar && f.jamKembali && f.jamKembali <= f.jamKeluar) return 'Jam kembali harus setelah jam keluar.';
  if (ji === 'Mengikuti Lomba/Kegiatan') {
    if (!f.namaKegiatan.trim()) return 'Nama lomba/kegiatan wajib diisi.';
    if (f.tglSelesai && f.tglSelesai < f.tglMulai) return 'Tanggal selesai tidak boleh sebelum tanggal mulai.';
  }
  if (f.keperluan.trim().length < 5) return 'Keperluan/alasan wajib diisi (minimal 5 huruf).';
  if (mode !== 'admin' && cfg.perluKode && !store.get('kodeAkses', '')) return 'Kode akses madrasah wajib diisi.';
  return '';
}

function cleanForm(f) {
  const ji = f.jenisIzin, lomba = ji === 'Mengikuti Lomba/Kegiatan';
  const o = {
    jenisPemohon: f.jenisPemohon, namaPemohon: f.namaPemohon.trim(), hpPemohon: f.hpPemohon.trim(), jenisIzin: ji,
    siswa: f.siswa.map(s => ({ nis: s.nis || '', nama: s.nama, kelas: s.kelas || '' })),
    tglMulai: f.tglMulai, tglSelesai: lomba ? f.tglSelesai : '',
    jamKeluar: lomba ? '' : f.jamKeluar, jamKembali: (ji === 'Keluar Sekolah Sementara' || ji === 'Lainnya') ? f.jamKembali : '',
    keperluan: f.keperluan.trim(),
    namaKegiatan: lomba ? f.namaKegiatan.trim() : '', tempat: lomba ? f.tempat.trim() : '',
    penyelenggara: lomba ? f.penyelenggara.trim() : '', pembina: lomba ? f.pembina.trim() : ''
  };
  if (lomba && f.lampiranData) o.lampiranData = f.lampiranData;
  return o;
}

function compressImage(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

// ---------------------------------------------------------------- halaman: ajukan (pemohon)
let formDraft = null;
function viewAjukan() {
  if (!formDraft) formDraft = blankForm('pemohon');
  app().innerHTML = `<h1>Ajukan Izin</h1><p class="mut small">Isi dengan benar. Pengajuan akan diteruskan ke Waka Kurikulum untuk disetujui.</p><div id="frm"></div>`;
  mountForm($('#frm'), formDraft, 'pemohon', submitPemohon);
  const kosong = !siswaList.length;
  loadSiswa().then(() => {
    // daftar siswa baru termuat → pasang ulang form (isian tetap tersimpan di formDraft)
    const frm = $('#frm');
    if (!(kosong && siswaList.length && curRoute() === 'ajukan' && frm)) return;
    if (!frm.contains(document.activeElement)) return mountForm(frm, formDraft, 'pemohon', submitPemohon);
    const n = $('#f-nosiswa', frm); if (n) n.remove();
    const c = $('#cari', frm); if (c && c.value) c.oninput();
  });
}

async function submitPemohon(f) {
  const izin = Object.assign(cleanForm(f), { id: newId(), kode: rand(6), dibuat: localISO() });
  const kodeAkses = store.get('kodeAkses', '');
  const entry = { id: izin.id, kode: izin.kode, jenisIzin: izin.jenisIzin, siswa: namaSiswa(izin), tgl: izin.tglMulai, dibuat: izin.dibuat };
  let queued = false;
  try {
    if (!DEMO && !navigator.onLine) throw new NetErr();
    const r = await api('ajukan', { izin, kodeAkses });
    if (!r.ok) { $('#f-err').textContent = 'Gagal: ' + (r.error || 'server menolak pengajuan'); return; }
  } catch (e) {
    if (!(e instanceof NetErr)) throw e;
    const ob = store.get('outbox', []); ob.push({ izin, kodeAkses }); store.set('outbox', ob); queued = true;
  }
  const mine = store.get('mine', []); mine.unshift(entry); store.set('mine', mine.slice(0, 50));
  formDraft = null;
  renderHeader();
  viewTerkirim(izin, queued);
}

function viewTerkirim(izin, queued) {
  const msg = `Assalamu'alaikum Pak, saya ${izin.namaPemohon} (${izin.jenisPemohon}) mengajukan izin "${izin.jenisIzin}" untuk ${namaSiswa(izin, 5)} pada ${rentang(izin)}. Keperluan: ${izin.keperluan}. Nomor pengajuan: ${izin.id}. Mohon persetujuannya. Terima kasih.`;
  app().innerHTML = `
    <div class="card ${queued ? 'note' : 'ok'}">
      <h2>${queued ? '📥 Pengajuan tersimpan' : '✅ Pengajuan terkirim'}</h2>
      <p>${queued ? 'HP sedang tidak terhubung internet. Pengajuan akan <b>terkirim otomatis</b> begitu ada sinyal (buka lagi aplikasi ini jika perlu).' : 'Pengajuan sudah masuk dan menunggu persetujuan Waka Kurikulum.'}</p>
      <p class="small">Nomor pengajuan & kode (simpan/screenshot):</p>
      <div class="idbox">${h(izin.id)} · ${h(izin.kode)}</div>
    </div>
    <div style="display:grid;gap:8px">
      ${cfg.waAdmin ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${waNum(cfg.waAdmin)}?text=${encodeURIComponent(msg)}">💬 Kabari Waka via WhatsApp</a>` : ''}
      <a class="btn ghost" href="#/status">🔎 Lihat status pengajuan</a>
      <a class="btn ghost" href="#/ajukan">📝 Ajukan izin lain</a>
    </div>`;
}

// ---------------------------------------------------------------- halaman: status (pemohon)
async function viewStatus() {
  const mine = store.get('mine', []);
  const ob = store.get('outbox', []);
  const obIds = new Set(ob.map(o => o.izin.id));
  app().innerHTML = `
    <div style="display:flex;align-items:center;gap:8px"><h1 style="flex:1">Status Pengajuan</h1><button class="btn ghost sm" id="s-ref">⟳ Perbarui</button></div>
    <div id="mine">${mine.length ? '' : '<div class="empty">Belum ada pengajuan dari HP ini.</div>'}</div>
    <div class="card">
      <h3>Cek pengajuan lain</h3>
      <p class="small mut">Masukkan nomor pengajuan dan kode 6 huruf (mis. dari HP lain).</p>
      <div class="row2"><input id="c-id" placeholder="IZN-261030-XXXX" autocapitalize="characters"><input id="c-k" placeholder="Kode" autocapitalize="characters" maxlength="6"></div>
      <button class="btn ghost block" id="c-go" style="margin-top:8px">Cek</button>
    </div>`;
  $('#s-ref').onclick = () => { flushOutbox(); viewStatus(); };
  $('#c-go').onclick = () => {
    const id = $('#c-id').value.trim().toUpperCase(), k = $('#c-k').value.trim().toUpperCase();
    if (!id || !k) return toast('Isi nomor pengajuan dan kode');
    location.hash = `#/lihat/${encodeURIComponent(id)}/${encodeURIComponent(k)}`;
  };
  const box = $('#mine');
  const card = (m, st, extra = '') => `<a class="item" ${st === 'Disetujui' ? `href="#/lihat/${encodeURIComponent(m.id)}/${encodeURIComponent(m.kode)}"` : ''}>
      <div class="meta"><span class="badge ${st ? 'st-' + st.split(' ')[0] : ''}">${h(st || 'Memeriksa…')}</span><span class="small mut">${h(m.id)}</span></div>
      <div class="t">${IKON_IZIN[m.jenisIzin] || ''} ${h(m.jenisIzin)}</div>
      <div class="small">${h(m.siswa)} · ${h(fmtTgl(m.tgl))}</div>${extra}
      ${st === 'Disetujui' ? '<div class="small" style="margin-top:6px;font-weight:600;color:var(--g)">Lihat surat izin →</div>' : ''}</a>`;
  if (!mine.length) return;
  box.innerHTML = mine.map(m => obIds.has(m.id) ? card(m, 'Belum terkirim', `<div class="small" style="color:var(--amb)">${h((ob.find(o => o.izin.id === m.id) || {}).error || 'Menunggu koneksi internet')}</div>`) : card(m, '')).join('');
  const results = await Promise.all(mine.map(async m => {
    if (obIds.has(m.id)) return null;
    try { const r = await api('cek', { id: m.id, k: m.kode }); return r.ok ? r.izin : { status: 'Tidak ditemukan', catatan: r.error }; }
    catch (e) { return { status: 'Offline' }; }
  }));
  if (curRoute() !== 'status') return;
  box.innerHTML = mine.map((m, i) => {
    if (obIds.has(m.id)) return card(m, 'Belum terkirim', `<div class="small" style="color:var(--amb)">${h((ob.find(o => o.izin.id === m.id) || {}).error || 'Menunggu koneksi internet')}</div>`);
    const r = results[i] || {};
    const extra = r.status === 'Ditolak' && r.catatan ? `<div class="small" style="color:var(--red)">Catatan: ${h(r.catatan)}</div>` : (r.status === 'Offline' ? '<div class="small mut">Tidak dapat memeriksa — sedang offline</div>' : '');
    return card(m, r.status, extra);
  }).join('');
}

async function viewLihat(id, k) {
  app().innerHTML = '<div class="empty">Memuat…</div>';
  let r;
  try { r = await api('cek', { id, k }); }
  catch (e) { app().innerHTML = `<div class="card note">Tidak dapat terhubung ke server. Coba lagi saat ada internet.</div><a class="btn ghost block" href="#/status">← Kembali</a>`; return; }
  if (!r.ok) { app().innerHTML = `<div class="card note">${h(r.error)}</div><a class="btn ghost block" href="#/status">← Kembali</a>`; return; }
  const z = r.izin; const c = Object.assign({}, DEFAULT_CFG, r.config);
  if (z.status !== 'Disetujui') {
    app().innerHTML = `<div class="card"><div class="meta"><span class="badge st-${h(z.status)}">${h(z.status)}</span><span class="small mut">${h(z.id)}</span></div>
      <h2>${h(z.jenisIzin)}</h2><p>${h(namaSiswa(z, 10))}</p>
      ${z.status === 'Ditolak' ? `<p style="color:var(--red)"><b>Catatan Waka:</b> ${h(z.catatan || '-')}</p>` : '<p class="mut">Belum disetujui. Silakan cek lagi nanti.</p>'}</div>
      <a class="btn ghost block" href="#/status">← Kembali</a>`;
    return;
  }
  app().innerHTML = `<div class="toolbar no-print"><a class="btn ghost" href="#/status">← Kembali</a><button class="btn" id="b-print">🖨️ Cetak / Simpan PDF</button></div>${suratHTML(z, c)}`;
  $('#b-print').onclick = () => window.print();
}

// ---------------------------------------------------------------- halaman: verifikasi QR
async function viewCek(id, k) {
  app().innerHTML = '<div class="empty">Memeriksa keaslian izin…</div>';
  let z = null, c = cfg, err = '', lokal = false;
  try {
    const r = await api('cek', { id, k });
    if (r.ok) { z = r.izin; c = Object.assign({}, DEFAULT_CFG, r.config); } else err = r.error;
  } catch (e) {
    const loc = records.find(x => x.id === id && x.kode === String(k).toUpperCase());
    if (admin && loc) { z = loc; lokal = true; } else err = 'Tidak dapat terhubung ke server untuk memeriksa. Pastikan ada koneksi internet lalu muat ulang.';
  }
  let box;
  if (!z) box = `<div class="verify v-bad"><div class="ic">✖</div><span class="vt">Tidak dapat diverifikasi</span><p>${h(err)}</p></div>`;
  else if (z.status === 'Disetujui') {
    const t = today(), akhir = z.tglSelesai || z.tglMulai;
    const berlaku = z.tglMulai <= t && t <= akhir;
    const jam = z.jamKeluar ? `<p>Keluar ${fmtJam(z.jamKeluar)}${z.jamKembali ? ', wajib kembali ' + fmtJam(z.jamKembali) : ''}</p>` : '';
    box = `<div class="verify ${berlaku ? 'v-ok' : 'v-warn'}"><div class="ic">${berlaku ? '✔' : '!'}</div><span class="vt">IZIN SAH</span>
      <p>${berlaku ? 'Berlaku <b>hari ini</b>' : (t < z.tglMulai ? 'Belum berlaku — untuk ' : 'Sudah lewat — berlaku ') + h(rentang(z))}</p>${jam}</div>`;
  } else if (z.status === 'Menunggu') box = `<div class="verify v-warn"><div class="ic">⏳</div><span class="vt">BELUM DISETUJUI</span><p>Pengajuan masih menunggu persetujuan.</p></div>`;
  else box = `<div class="verify v-bad"><div class="ic">✖</div><span class="vt">IZIN DITOLAK</span><p>${h(z.catatan || '')}</p></div>`;
  app().innerHTML = `${box}
    ${lokal ? '<div class="card note small">Diperiksa dari data di HP ini (offline).</div>' : ''}
    ${z ? `<div class="card"><h3>${IKON_IZIN[z.jenisIzin] || ''} ${h(z.jenisIzin)}</h3>
      <dl class="kv"><dt>Nomor</dt><dd>${h(z.id)}</dd><dt>Siswa</dt><dd>${(z.siswa || []).map(s => h(s.nama) + (s.kelas ? ' (' + h(s.kelas) + ')' : '')).join('<br>')}</dd>
      <dt>Tanggal</dt><dd>${h(rentang(z))}</dd><dt>Keperluan</dt><dd>${h(z.keperluan)}</dd>
      ${z.kembaliAktual ? `<dt>Sudah kembali</dt><dd>${h(fmtWaktu(z.kembaliAktual))}</dd>` : ''}</dl>
      ${z.status === 'Disetujui' ? '<button class="btn ghost block" id="b-surat">Lihat surat lengkap</button>' : ''}</div><div id="sv"></div>` : ''}
    <a class="btn ghost block no-print" href="${baseUrl()}#/">Ke beranda e-Izin</a>`;
  const bs = $('#b-surat');
  if (bs) bs.onclick = () => { $('#sv').innerHTML = suratHTML(z, c) + '<p></p>'; bs.remove(); };
}

// ---------------------------------------------------------------- surat izin
function judulSurat(ji) {
  return { 'Keluar Sekolah Sementara': 'SURAT IZIN KELUAR MADRASAH', 'Pulang Lebih Awal': 'SURAT IZIN PULANG', 'Mengikuti Lomba/Kegiatan': 'SURAT DISPENSASI' }[ji] || 'SURAT IZIN';
}
function qrSvg(text) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 8, scalable: true, alt: 'Kode QR verifikasi' }); }
  catch (e) { return ''; }
}
function suratHTML(z, c) {
  const lomba = z.jenisIzin === 'Mengikuti Lomba/Kegiatan';
  const rows = [];
  if (lomba) {
    rows.push(['Kegiatan', z.namaKegiatan]);
    if (z.penyelenggara) rows.push(['Penyelenggara', z.penyelenggara]);
    if (z.tempat) rows.push(['Tempat', z.tempat]);
    rows.push(['Hari/Tanggal', rentang(z)]);
    if (z.pembina) rows.push(['Pendamping', z.pembina]);
  } else {
    rows.push(['Hari/Tanggal', rentang(z)]);
    if (z.jamKeluar) rows.push(['Waktu', z.jenisIzin === 'Pulang Lebih Awal' ? 'Pulang pukul ' + fmtJam(z.jamKeluar) : 'Pukul ' + fmtJam(z.jamKeluar) + (z.jamKembali ? ' s.d. ' + fmtJam(z.jamKembali) : '')]);
  }
  rows.push(['Keperluan', z.keperluan]);
  if (z.catatan) rows.push(['Catatan', z.catatan]);
  const penutup = {
    'Keluar Sekolah Sementara': 'Siswa yang bersangkutan wajib kembali ke madrasah sesuai waktu yang tercantum dan melapor kepada guru piket. Demikian surat izin ini diberikan untuk dipergunakan sebagaimana mestinya.',
    'Mengikuti Lomba/Kegiatan': 'Sehubungan dengan kegiatan tersebut, siswa yang namanya tercantum di atas diberikan dispensasi dari kegiatan belajar mengajar selama waktu kegiatan berlangsung. Demikian surat dispensasi ini dibuat untuk dipergunakan sebagaimana mestinya.'
  }[z.jenisIzin] || 'Demikian surat izin ini diberikan untuk dipergunakan sebagaimana mestinya.';
  const tglTtd = (z.diputuskan || z.dibuat || today()).slice(0, 10);
  return `<article class="paper" id="surat">
    <div class="kop"><div class="k1">${h(c.kop1)}</div><div class="k2">${h(c.kop2)}</div><div class="k3">${h(c.kop3)}</div>${c.alamat ? `<div class="al">${h(c.alamat)}</div>` : ''}</div>
    <hr class="kopline">
    <div class="judul">${judulSurat(z.jenisIzin)}</div>
    <div class="nomor">Nomor: ${h(z.id)}</div>
    <p>Yang bertanda tangan di bawah ini, ${h(c.jabatan)} ${h(c.namaMadrasah)}, memberikan ${lomba ? 'dispensasi' : 'izin'} kepada:</p>
    <table class="tbl"><thead><tr><th style="width:34px">No</th><th>Nama</th><th style="width:22%">NIS</th><th style="width:16%">Kelas</th></tr></thead>
    <tbody>${(z.siswa || []).map((s, i) => `<tr><td>${i + 1}</td><td>${h(s.nama)}</td><td>${h(s.nis || '-')}</td><td>${h(s.kelas || '-')}</td></tr>`).join('')}</tbody></table>
    <table class="det">${rows.map(([a, b]) => `<tr><td>${h(a)}</td><td>:</td><td>${h(b)}</td></tr>`).join('')}</table>
    <p style="text-align:justify">${penutup}</p>
    <div class="foot">
      <div class="qr">${qrSvg(verifyUrl(z))}Pindai untuk cek keaslian<br>Kode: <b>${h(z.kode)}</b></div>
      <div class="ttd">${h(c.kota)}, ${h(fmtTgl(tglTtd, false))}<br>${h(c.jabatan)},

        <b><u>${h(c.penandatangan)}</u></b>${c.nip ? `<br>NIP. ${h(c.nip)}` : ''}</div>
    </div>
    <div class="ket">Diajukan oleh ${h(z.namaPemohon)} (${h(z.jenisPemohon)}) · Disetujui secara elektronik melalui e-Izin pada ${h(fmtWaktu(z.diputuskan))}. Keaslian surat dapat diperiksa dengan memindai kode QR.</div>
  </article>`;
}

function viewLogin() {
  app().innerHTML = `
    <div class="card" style="max-width:420px;margin:24px auto">
      <h2>Masuk sebagai Waka</h2>
      <p class="small mut">Gunakan PIN admin yang tertera di sheet <i>Pengaturan</i>.${DEMO ? ' Untuk demo: <b>123456</b>.' : ''}</p>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
      <p class="small" id="l-err" style="color:var(--red)"></p>
      <button class="btn block" id="l-go">Masuk</button>
    </div>`;
  const go = async () => {
    const pin = $('#pin').value.trim(); if (!pin) return;
    $('#l-go').disabled = true; $('#l-err').textContent = '';
    try {
      const r = await api('login', { pin });
      if (!r.ok) { $('#l-err').textContent = r.error || 'PIN salah'; return; }
      cfg = Object.assign({}, DEFAULT_CFG, r.config); pendingTtd(); store.set('cfg', cfg);
      store.set('pinhash', await sha(pin));
      admin = { pin }; store.set('admin', admin);
      location.hash = '#/admin/menunggu'; route(); syncAdmin(true);
    } catch (e) {
      const hs = store.get('pinhash', '');
      if (hs && hs === await sha(pin)) {
        admin = { pin }; store.set('admin', admin);
        toast('Masuk dalam mode offline'); location.hash = '#/admin/menunggu'; route();
      } else $('#l-err').textContent = 'Tidak ada koneksi. Masuk offline hanya bisa di HP yang sebelumnya pernah login online.';
    } finally { const b = $('#l-go'); if (b) b.disabled = false; }
  };
  $('#l-go').onclick = go;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => $('#pin') && $('#pin').focus(), 50);
}

// ---------------------------------------------------------------- admin: rekap
let rekapBulan = '';
function rekapData(bulan) {
  const recs = records.filter(r => !bulan || String(r.tglMulai).slice(0, 7) === bulan);
  const ok = recs.filter(r => r.status === 'Disetujui');
  const det = []; ok.forEach(r => (r.siswa || []).forEach(s => det.push({ r, s })));
  const count = (arr, key) => { const m = new Map(); arr.forEach(x => { const k = key(x); m.set(k, (m.get(k) || 0) + 1); }); return Array.from(m, ([k, v]) => [k, v]).sort((a, b) => b[1] - a[1]); };
  const perSiswa = new Map();
  det.forEach(({ r, s }) => {
    const k = (s.nis || '') + '|' + s.nama.toLowerCase();
    const o = perSiswa.get(k) || { nama: s.nama, nis: s.nis, kelas: s.kelas, total: 0, keluar: 0, lomba: 0, lain: 0 };
    o.total++;
    if (r.jenisIzin === 'Mengikuti Lomba/Kegiatan') o.lomba++; else if (r.jenisIzin === 'Lainnya') o.lain++; else o.keluar++;
    perSiswa.set(k, o);
  });
  return {
    recs, ok, det,
    st: { total: recs.length, ok: ok.length, tolak: recs.filter(r => r.status === 'Ditolak').length, tunggu: recs.filter(r => r.status === 'Menunggu').length },
    jenis: JENIS_IZIN.map(j => [j, det.filter(d => d.r.jenisIzin === j).length]),
    pemohon: count(recs, r => r.jenisPemohon),
    kelas: count(det, d => d.s.kelas || '(tanpa kelas)'),
    siswa: Array.from(perSiswa.values()).sort((a, b) => b.total - a.total || a.nama.localeCompare(b.nama))
  };
}
function bars(rows, unit) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(([k, v]) => `<div class="brow" title="${h(k)}: ${v} ${unit}"><span class="nm">${h(k)}</span><div class="btrack"><div class="bfill${v ? '' : ' z'}" style="width:${(v / max * 100).toFixed(1)}%"></div></div><span class="v">${v}</span></div>`).join('')}</div>`;
}
function adminRekap() {
  const bulanSet = Array.from(new Set(records.map(r => String(r.tglMulai).slice(0, 7)).filter(x => /^\d{4}-\d{2}$/.test(x)))).sort().reverse();
  if (rekapBulan && !bulanSet.includes(rekapBulan)) rekapBulan = '';
  const D = rekapData(rekapBulan);
  const lbl = b => { const [y, m] = b.split('-'); return BULAN[Number(m) - 1] + ' ' + y; };
  app().innerHTML = `
    <h1>Rekap Izin</h1>
    <div class="filters"><select id="k-b"><option value="">Semua bulan</option>${bulanSet.map(b => `<option value="${b}" ${b === rekapBulan ? 'selected' : ''}>${lbl(b)}</option>`).join('')}</select>
      <button class="btn" id="k-x">⬇︎ Unduh Excel</button></div>
    <div class="tiles">
      <div class="tile"><b>${D.st.total}</b><span>Pengajuan</span></div>
      <div class="tile"><b>${D.st.ok}</b><span>Disetujui</span></div>
      <div class="tile"><b>${D.st.tolak}</b><span>Ditolak</span></div>
      <div class="tile"><b>${D.st.tunggu}</b><span>Menunggu</span></div>
      <div class="tile"><b>${D.siswa.length}</b><span>Siswa berizin</span></div>
    </div>
    ${D.st.total ? `
    <div class="card"><h3>Siswa diizinkan per jenis izin</h3><p class="small mut">Dihitung per siswa, hanya izin yang disetujui.</p>${bars(D.jenis, 'siswa')}</div>

// ---------------------------------------------------------------- ekspor Excel (.xlsx tanpa pustaka luar)
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(); const parts = [], central = []; let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true);
    ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function xmlEsc(s) { return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function makeXlsx(sheets) {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files = [];
  files.push({ name: '[Content_Types].xml', data: head + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>' });
  files.push({ name: '_rels/.rels', data: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
  files.push({ name: 'xl/workbook.xml', data: head + `<workbook xmlns="${NS}" xmlns:r="${RNS}"><sheets>` + sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>' });
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` });
  files.push({ name: 'xl/styles.xml', data: head + `<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE6F2EA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` });
  sheets.forEach((s, si) => {
    let x = head + `<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`;
    if (s.widths) x += '<cols>' + s.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
    x += '<sheetData>';
    s.rows.forEach((r, ri) => {
      x += `<row r="${ri + 1}">`;
      r.forEach((v, ci) => {
        const ref = colName(ci) + (ri + 1), st = ri === 0 ? ' s="1"' : '';
        if (typeof v === 'number' && isFinite(v)) x += `<c r="${ref}"${st}><v>${v}</v></c>`;
        else if (v !== '' && v !== null && v !== undefined) x += `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
      });
      x += '</row>';
    });
    x += '</sheetData>';
    if (s.rows.length > 1) x += `<autoFilter ref="A1:${colName(s.rows[0].length - 1)}${s.rows.length}"/>`;
    x += '</worksheet>';
    files.push({ name: `xl/worksheets/sheet${si + 1}.xml`, data: x });
  });
  return zipStore(files);
}
function exportExcel(D, label) {
  const recs = D.recs.slice().sort((a, b) => String(a.tglMulai).localeCompare(String(b.tglMulai)));
  const data = [['ID', 'Status', 'Jenis Izin', 'Tanggal Mulai', 'Tanggal Selesai', 'Jam Keluar', 'Jam Kembali', 'Daftar Siswa', 'Jumlah Siswa', 'Jenis Pemohon', 'Nama Pemohon', 'HP Pemohon', 'Keperluan', 'Kegiatan/Lomba', 'Tempat', 'Penyelenggara', 'Pendamping', 'Sumber', 'Diajukan', 'Diputuskan', 'Catatan Waka', 'Kembali Aktual']];
  recs.forEach(r => data.push([r.id, r.status, r.jenisIzin, r.tglMulai, r.tglSelesai, r.jamKeluar, r.jamKembali, (r.siswa || []).map(s => `${s.nama} (${s.kelas || '-'})`).join('; '), (r.siswa || []).length, r.jenisPemohon, r.namaPemohon, r.hpPemohon, r.keperluan, r.namaKegiatan, r.tempat, r.penyelenggara, r.pembina, r.sumber, String(r.dibuat || '').replace('T', ' '), String(r.diputuskan || '').replace('T', ' '), r.catatan, String(r.kembaliAktual || '').replace('T', ' ')]));
  const per = [['ID', 'Tanggal', 'NIS', 'Nama', 'Kelas', 'Jenis Izin', 'Jenis Pemohon', 'Status']];
  recs.forEach(r => (r.siswa || []).forEach(s => per.push([r.id, r.tglMulai, s.nis, s.nama, s.kelas, r.jenisIzin, r.jenisPemohon, r.status])));
  const rek = [['Nama', 'NIS', 'Kelas', 'Total Disetujui', 'Keluar/Pulang', 'Lomba/Kegiatan', 'Lainnya']];
  D.siswa.forEach(s => rek.push([s.nama, s.nis, s.kelas, s.total, s.keluar, s.lomba, s.lain]));
  const blob = makeXlsx([
    { name: 'Data Izin', rows: data, widths: [18, 11, 24, 12, 12, 9, 9, 40, 8, 22, 24, 15, 40, 26, 20, 20, 22, 10, 18, 18, 24, 18] },
    { name: 'Per Siswa', rows: per, widths: [18, 12, 12, 28, 10, 24, 22, 11] },
    { name: 'Rekap Siswa', rows: rek, widths: [28, 12, 10, 14, 13, 14, 9] }
  ]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Rekap Izin Siswa - ${label}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('File Excel diunduh');
}

function sigPad(cv) {
  const ctx = cv.getContext('2d'); let drawing = false, dirty = false, last = null;
  const fit = () => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1a5c'; };
  fit();
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.onpointerdown = e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); dirty = true; };
  cv.onpointermove = e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; dirty = true; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  $('#s-clr').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; };
  $('#s-save').onclick = () => {
    if (!dirty) return toast('Silakan tanda tangan di kotak terlebih dahulu');
    const data = trimSignature(cv);
    if (!data) return toast('Tanda tangan terlalu rumit, coba lebih sederhana');
    pushOp({ type: 'ttd', dataUrl: data });
    toast('Tanda tangan disimpan ✓'); adminSetelan();
  };
}

function trimSignature(cv) {
  const ctx = cv.getContext('2d'); const { width: w, height: hh } = cv;
  const px = ctx.getImageData(0, 0, w, hh).data;
  let x0 = w, y0 = hh, x1 = -1, y1 = -1;
  for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (px[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return '';
  const m = 6 * (window.devicePixelRatio || 1); x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(hh - 1, y1 + m);
  for (const H of [140, 110, 90, 70]) {
    const sc = Math.min(1, H / (y1 - y0 + 1));
    const o = document.createElement('canvas'); o.width = Math.max(1, Math.round((x1 - x0 + 1) * sc)); o.height = Math.max(1, Math.round((y1 - y0 + 1) * sc));
    o.getContext('2d').drawImage(cv, x0, y0, x1 - x0 + 1, y1 - y0 + 1, 0, 0, o.width, o.height);
    const d = o.toDataURL('image/png');
    if (d.length < 45000) return d;
  }
  return '';
}
